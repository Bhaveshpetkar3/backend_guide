<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }} — {{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  {% seo %}

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="site-header">
    <div class="header-inner">
      <a href="{{ '/' | relative_url }}" class="brand">
        backend mastery
        <span class="brand-tag">v1.0</span>
      </a>

      <div class="header-right">
        <nav class="nav-links">
          <a href="{{ '/' | relative_url }}" class="nav-link {% if page.url == '/' %}active{% endif %}">Home</a>
          <a href="{{ '/roadmap/' | relative_url }}" class="nav-link {% if page.url contains 'roadmap' %}active{% endif %}">Roadmap</a>
          {% for guide in site.guides %}
            <a href="{{ guide.url | relative_url }}" class="nav-link {% if page.url == guide.url %}active{% endif %}">{{ guide.nav_title | default: guide.title }}</a>
          {% endfor %}
        </nav>

        <button class="theme-toggle-btn" id="themeToggle" aria-label="Toggle theme" title="Toggle dark/light mode">
          <span class="theme-icon">☀️</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="site-main">
    <div class="container">
      {{ content }}
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="footer-inner">
      <div>backend mastery — deliberate practice program</div>
      <div>
        <a href="https://github.com/Bhaveshpetkar3/backend_guide" target="_blank" rel="noopener">github repo</a>
      </div>
    </div>
  </footer>

  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
